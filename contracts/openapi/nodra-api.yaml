openapi: 3.0.3
info:
  title: Nodra API
  version: 1.0.0
  description: API versionada do Nodra com autorização contextual delegada ao Keycloak.
servers:
  - url: http://localhost:8081
    description: Laboratório local
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      summary: Verifica se a API está em execução
      description: Retorna liveness sem autenticação ou consulta a serviços externos.
      security: []
      responses:
        "200":
          description: API em execução
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/session:
    get:
      summary: Retorna a identidade técnica da sessão
      description: Exige um access token válido emitido pelo realm Altivy.
      responses:
        "200":
          description: Sessão autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me/trash-settings:
    get:
      summary: Obtém o parâmetro de retenção da lixeira do sujeito
      description: Exige sessão autenticada e retorna somente o parâmetro associado ao `sub` atual. Null indica ausência de configuração.
      responses:
        "200":
          description: Parâmetro atual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashSettingsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      summary: Atualiza o parâmetro de retenção da lixeira do sujeito
      description: >-
        Exige sessão autenticada. Aceita null para desabilitar a remoção automática. Este parâmetro não habilita purge sem step-up OIDC recente e auditoria append-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashSettingsRequest" }
      responses:
        "204": { description: Parâmetro salvo }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/vaults:
    get:
      summary: Lista os vaults autorizados
      description: >-
        Retorna somente vaults com decisão positiva para `vault:read`. Os candidatos negados não são expostos e a requisição falha integralmente quando o serviço de autorização fica indisponível.
      parameters:
        - $ref: "#/components/parameters/VaultCursor"
        - $ref: "#/components/parameters/VaultLimit"
      responses:
        "200":
          description: Página de vaults autorizados ordenada pelo identificador opaco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/vaults/{vaultId}:
    get:
      summary: Obtém um vault autorizado
      description: Consulta o Keycloak Authorization Services antes de revelar os metadados do vault.
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Vault autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultAccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/vaults/{vaultId}/notes:
    get:
      summary: Lista as notas autorizadas do vault
      description: Exige `vault:read` e retorna o catálogo ordenado de notas Markdown acessíveis ao sujeito.
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Catálogo de notas autorizado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/vaults/{vaultId}/entries:
    get:
      summary: Lista filhos imediatos de uma pasta autorizada
      description: >-
        Exige `vault:read` e retorna somente pastas e notas Markdown diretamente contidas em `parentPath`. Quando ausente, a pasta consultada é a raiz do vault. Paths são normalizados e não podem escapar do vault.
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - name: parentPath
          in: query
          required: false
          description: Caminho relativo normalizado da pasta; ausente representa a raiz.
          schema:
            type: string
            maxLength: 1024
            example: projetos
      responses:
        "200":
          description: Filhos imediatos ordenados pelo caminho relativo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/vaults/{vaultId}/folders/{path}:
    put:
      summary: Garante a existência de uma pasta no vault
      description: >-
        Exige `vault:write`. Operação idempotente: cria a pasta relativa quando ausente, não altera uma pasta existente e não cria pais implicitamente. Falha se um arquivo já ocupar o caminho.
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "201":
          description: Pasta criada
          headers:
            Location:
              description: URL da pasta criada
              schema: { type: string, format: uri-reference }
        "204": { description: Pasta já existente; nenhuma alteração foi realizada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Vault ou pasta pai inexistente }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      summary: Move uma pasta para a lixeira
      description: >-
        Exige `vault:delete`. Move a pasta e toda sua subárvore para a lixeira do sujeito autenticado. O conteúdo não é removido permanentemente e não aparece no catálogo ativo.
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "204": { description: Pasta movida para a lixeira }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      summary: Move ou renomeia uma pasta
      description: >-
        Exige `vault:write`. Move a pasta com todo o conteúdo, nunca sobrescreve o destino, não cria pastas pai implicitamente e rejeita destino igual ou interno à origem com 400. Links simbólicos na subárvore bloqueiam a operação. O campo `code` do problema distingue `folder-destination-exists` e `folder-destination-folder-missing`.
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/FolderPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderMoveRequest" }
      responses:
        "200":
          description: Pasta movida para o novo caminho
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string, example: arquivo/projetos }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/vaults/{vaultId}/trash:
    get:
      summary: Lista operações da lixeira do sujeito autenticado
      description: >-
        Exige `vault:read`. Retorna metadados mínimos somente das operações pertencentes ao `sub` autenticado. A lista usa cursor e não revela conteúdo de notas.
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/TrashCursor"
        - $ref: "#/components/parameters/TrashLimit"
      responses:
        "200":
          description: Página ordenada pela exclusão mais recente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      summary: Esvazia a lixeira do vault
      description: >-
        Exige `vault:delete`, confirmação explícita na interface e reautenticação OIDC recente. O BFF injeta a evidência `auth_time` somente no tráfego interno; a senha nunca chega à API. A operação registra intenção e resultado em auditoria append-only e pode retornar falhas parciais.
      responses:
        "200":
          description: Resultado da remoção das operações da lixeira
          content:
            application/json:
              schema:
                type: object
                required: [removedOperations, failedOperations]
                properties:
                  removedOperations: { type: integer, format: int32, minimum: 0 }
                  failedOperations: { type: integer, format: int32, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/vaults/{vaultId}/trash/{operationId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - name: operationId
        in: path
        required: true
        description: Identificador opaco da operação de lixeira.
        schema: { type: string, format: uuid }
    patch:
      summary: Restaura uma operação da lixeira
      description: >-
        Exige `vault:write`. O usuário informa o caminho relativo de destino. A operação nunca sobrescreve conteúdo; a colisão retorna `trash-destination-exists` e uma pasta pai ausente retorna `trash-destination-folder-missing`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashRestoreRequest" }
      responses:
        "204": { description: Conteúdo restaurado para o destino informado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/vaults/{vaultId}/notes/{path}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/NotePath"
    get:
      summary: Obtém uma nota autorizada
      description: Exige `vault:read`; devolve conteúdo Markdown canônico e seu ETag para alterações posteriores.
      responses:
        "200":
          description: Nota encontrada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      summary: Cria uma nota Markdown
      description: Exige `vault:write`; falha quando já houver uma nota no mesmo caminho relativo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteRequest" }
      responses:
        "201":
          description: Nota criada
          headers:
            Location:
              description: URL da nota criada
              schema: { type: string, format: uri-reference }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      summary: Substitui uma nota Markdown
      description: Exige `vault:write` e o header `If-Match` com o ETag recebido pela leitura mais recente.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteRequest" }
      responses:
        "204": { description: Nota atualizada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      summary: Move uma nota Markdown para a lixeira
      description: Exige `vault:delete` e o header `If-Match` com o ETag atual da nota. O conteúdo permanece recuperável na lixeira.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Nota movida para a lixeira }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      summary: Move ou renomeia uma nota Markdown
      description: >-
        Exige `vault:write` e o header `If-Match` com o ETag atual. Altera somente o caminho relativo da nota: o conteúdo e o ETag são preservados, o destino nunca é sobrescrito e pastas não são criadas implicitamente. O campo `code` do problema distingue `note-version-conflict`, `note-destination-exists` e `note-destination-folder-missing`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteMoveRequest" }
      responses:
        "200":
          description: Nota movida para o novo caminho
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string, example: projetos/plano.md }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VaultCursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco retornado pela página anterior.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        example: djE6bGFiLTAwMDE
    VaultLimit:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de vaults autorizados na página.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    TrashCursor:
      name: cursor
      in: query
      required: false
      description: ID opaco da última operação retornada na página anterior.
      schema: { type: string, format: uuid }
    TrashLimit:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de operações de lixeira na página.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    VaultId:
      name: vaultId
      in: path
      required: true
      description: Identificador opaco do vault, formado por letras minúsculas, números e hífen.
      schema:
        type: string
        pattern: "^[a-z0-9-]+$"
        maxLength: 64
        example: lab-0001
    NotePath:
      name: path
      in: path
      required: true
      allowReserved: true
      description: Caminho relativo normalizado de uma nota Markdown, sem traversal ou path absoluto.
      schema:
        type: string
        example: projetos/plano.md
    FolderPath:
      name: path
      in: path
      required: true
      allowReserved: true
      description: Caminho relativo normalizado da pasta, sem traversal ou path absoluto.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        example: projetos/decisoes
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag da versão lida, incluindo aspas quando retornadas pela API.
      schema: { type: string }
  headers:
    ETag:
      description: Versão opaca do conteúdo da nota.
      schema: { type: string }
  schemas:
    SessionResponse:
      type: object
      required: [subject, authenticated]
      properties:
        subject:
          type: string
          nullable: true
          description: Identificador técnico do sujeito autenticado.
        authenticated:
          type: boolean
          example: true
    VaultAccessResponse:
      type: object
      required: [id, scope]
      properties:
        id:
          type: string
          description: Identificador opaco do vault.
          example: lab-0001
        scope:
          type: string
          enum: [vault:read]
          example: vault:read
    VaultSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: Identificador técnico e opaco do vault autorizado.
          pattern: "^[a-z0-9-]+$"
          maxLength: 64
          example: lab-0001
        name:
          type: string
          description: Nome de exibição do vault autorizado.
          maxLength: 200
          example: Laboratório de produto
    VaultPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VaultSummary"
        nextCursor:
          type: string
          nullable: true
          description: Cursor opaco para continuar a listagem ou `null` ao final.
          maxLength: 512
          example: djE6bGFiLTAwMDE
    NoteSummary:
      type: object
      required: [path, eTag]
      properties:
        path: { type: string, example: projetos/plano.md }
        eTag: { type: string, example: 8E5D0B7C }
    VaultEntry:
      type: object
      additionalProperties: false
      required: [path, name, kind, eTag, isUnclassified, hasMinimumMetadata, hasUnresolvedLinks]
      properties:
        path:
          type: string
          maxLength: 1024
          example: projetos/plano.md
        name:
          type: string
          maxLength: 255
          example: plano.md
        kind:
          type: string
          enum: [folder, note]
        eTag:
          type: string
          nullable: true
          description: Versão da nota; nula para pastas.
        isUnclassified:
          type: boolean
          nullable: true
          description: Indica ausência de classificação válida ou uso do padrão; nulo para pastas.
        hasMinimumMetadata:
          type: boolean
          nullable: true
          description: Indica a presença de versão, classificação, tipo e ao menos uma tag válidos; nulo para pastas.
        hasUnresolvedLinks:
          type: boolean
          nullable: true
          description: Indica se a nota contém links internos que não resolvem para um caminho conhecido do vault; nulo para pastas.
    Note:
      type: object
      required: [path, content]
      properties:
        path: { type: string, example: projetos/plano.md }
        content: { type: string, example: "# Plano\n" }
    NoteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1048576
    NoteMoveRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Novo caminho relativo da nota Markdown.
          example: projetos/plano.md
    FolderMoveRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Novo caminho relativo da pasta.
          example: arquivo/projetos
    TrashRestoreRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Destino relativo escolhido explicitamente pelo usuário.
          example: arquivo/plano-restaurado.md
    TrashSettingsRequest:
      type: object
      additionalProperties: false
      required: [retentionDays]
      properties:
        retentionDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: Prazo capturado em novas exclusões; null desabilita remoção automática.
    TrashSettingsResponse:
      type: object
      additionalProperties: false
      required: [retentionDays]
      properties:
        retentionDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
    TrashEntry:
      type: object
      additionalProperties: false
      required: [id, path, name, kind, deletedAtUtc, retentionDays, canRestoreToOriginal]
      properties:
        id: { type: string, format: uuid }
        path: { type: string, maxLength: 1024, description: Caminho relativo original. }
        name: { type: string, maxLength: 255 }
        kind: { type: string, enum: [folder, note] }
        deletedAtUtc: { type: string, format: date-time }
        retentionDays: { type: integer, nullable: true, minimum: 1, maximum: 3650 }
        canRestoreToOriginal:
          type: boolean
          description: Indica se o caminho original está disponível no momento da listagem.
    TrashPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/TrashEntry" }
        nextCursor: { type: string, nullable: true, format: uuid }
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Permissão vault:read negada pelo Keycloak
      content:
        application/problem+json:
          schema:
