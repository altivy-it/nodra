name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Retry publication for an existing release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs:
      - release
    if: always() && (needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name || inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag SemVer inválida: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate manual publication retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          release_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo 'A branch origin/main não foi carregada pelo checkout.' >&2
            exit 1
          }
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo 'A tag de release não está integrada em main.' >&2
            exit 1
          }
          successful_ci="$(gh run list --workflow .github/workflows/ci.yml \
            --commit "$release_sha" --json conclusion,event \
            --jq '[.[] | select(.conclusion == "success" and .event == "push")] | length')"
          [[ "$successful_ci" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Não há execução CI verde para o commit da release.' >&2
            exit 1
          }

      - name: Refuse to overwrite published digest manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '[.assets[].name] | index("images.env") != null' | grep -qx true; then
            echo "A release $RELEASE_TAG já possui manifesto de digests; publicação imutável bloqueada." >&2
            exit 1
          fi

      - name: Initialize Buildx and GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx inspect --bootstrap
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, scan, and publish immutable images
        id: images
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_PLATFORM: ${{ vars.ALTIVY_RELEASE_PLATFORM || 'linux/amd64' }}
          TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:c6e969c5662a546ad5de4a73c2a6b7a7c627f86d916903e175aa623af5b97ada
        shell: bash
        run: |
          set -Eeuo pipefail
          image_namespace=ghcr.io/lzocateli
          manifest="$RUNNER_TEMP/images.env"
          declare -A release_images=()
          : > "$manifest"
          chmod 600 "$manifest"

          while IFS='|' read -r image dockerfile name; do
            metadata="$RUNNER_TEMP/${name}-metadata.json"
            candidate_ref="$image_namespace/$image:candidate-$GITHUB_SHA"
            build_args=(--build-arg "IMAGE_VERSION=$RELEASE_VERSION")
            if [[ "$image" == "altivy-web" ]]; then
              build_args+=(--build-arg WEB_CONFIGURATION=production --build-arg WEB_BASE_HREF=/)
            fi

            if candidate_info="$(docker buildx imagetools inspect "$candidate_ref" 2>/dev/null)"; then
              digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<< "$candidate_info" | head -n 1)"
            else
              docker buildx build \
                --platform "$TARGET_PLATFORM" \
                --file "$dockerfile" \
                --tag "$candidate_ref" \
                --metadata-file "$metadata" \
                --provenance=mode=max \
                --sbom=true \
                --push \
                "${build_args[@]}" \
                .
              digest="$(jq -r '.["containerimage.digest"] // empty' "$metadata")"
            fi

            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Não foi possível obter digest válido para $candidate_ref" >&2
              exit 1
            fi
            immutable_ref="$image_namespace/$image@$digest"
            docker pull "$immutable_ref"
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --ignore-unfixed --severity CRITICAL --exit-code 1 "$immutable_ref"
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP:/reports" "$TRIVY_IMAGE" image \
              --format cyclonedx --output "/reports/${name}.cdx.json" "$immutable_ref"

            case "$image" in
              altivy-web) key=ALTIVY_WEB_IMAGE ;;
              altivy-api) key=ALTIVY_API_IMAGE ;;
              altivy-bff) key=ALTIVY_BFF_IMAGE ;;
              altivy-worker) key=ALTIVY_WORKER_IMAGE ;;
              altivynotes-migrations) key=ALTIVY_MIGRATIONS_IMAGE ;;
              *) echo "Imagem não permitida: $image" >&2; exit 1 ;;
            esac
            printf '%s=%s\n' "$key" "$immutable_ref" >> "$manifest"
            release_images["$image"]="$immutable_ref"
            printf '%s  %s\n' "${digest#sha256:}" "${name}.cdx.json" >> "$RUNNER_TEMP/sbom-checksums.txt"
          done <<'IMAGES'
          altivy-web|frontend/web/Dockerfile|web
          altivy-api|backend/apps/api/Dockerfile|api
          altivy-bff|backend/apps/bff/Dockerfile|bff
          altivy-worker|backend/apps/worker/Dockerfile|worker
          altivynotes-migrations|deploy/production/migrations.Dockerfile|migrations
          IMAGES

          for image in altivy-web altivy-api altivy-bff altivy-worker altivynotes-migrations; do
            release_ref="$image_namespace/$image:$RELEASE_TAG"
            expected_digest="${release_images[$image]##*@}"
            if existing_info="$(docker buildx imagetools inspect "$release_ref" 2>/dev/null)"; then
              existing_digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<< "$existing_info" | head -n 1)"
              if [[ "$existing_digest" != "$expected_digest" ]]; then
                echo "Tag imutável $release_ref já existe com outro digest." >&2
                exit 1
              fi
            else
              docker buildx imagetools create --tag "$release_ref" "${release_images[$image]}"
            fi
          done

          (cd "$RUNNER_TEMP" && sha256sum images.env > images.env.sha256)
          (cd "$RUNNER_TEMP" && sha256sum web.cdx.json api.cdx.json bff.cdx.json worker.cdx.json migrations.cdx.json > sboms.sha256)
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Attach digests, SBOMs, and BuildKit provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/images.env" \
            "$RUNNER_TEMP/images.env.sha256" \
            "$RUNNER_TEMP/sboms.sha256" \
            "$RUNNER_TEMP"/*.cdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Logout from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io || true