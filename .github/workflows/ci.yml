name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository Baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate repository
        shell: pwsh
        run: |
          ./eng/test-validate-repository.ps1
          ./eng/validate-repository.ps1

  result:
    name: Result
    if: ${{ always() }}
    needs:
      - repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate required jobs
        env:
          REPOSITORY_BASELINE_RESULT: ${{ needs.repository-baseline.result }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_BASELINE_RESULT" != "success" ]]; then
            echo "Repository Baseline terminou com: $REPOSITORY_BASELINE_RESULT"
            exit 1
          fi