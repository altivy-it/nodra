name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

jobs:
  hygiene:
    name: Hygiene
    uses: ./.github/workflows/gw-pr-hygiene.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read

  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gw-gitleaks.yml
    permissions:
      contents: read

  repository-baseline:
    name: Repository Baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --entrypoint pwsh lzocateli/dotnet-sdk:10.0.403-noble-v1 \
            -NoProfile -Command '& ./tools/scripts/test-validate-repository.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & ./tools/scripts/validate-repository.ps1; exit $LASTEXITCODE'

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and build Angular in container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/frontend/web:/workspace" \
            --tmpfs /workspace/node_modules:rw,exec,mode=1777 \
            --tmpfs /workspace/dist:rw,exec,mode=1777 \
            --tmpfs /workspace/.angular:rw,exec,mode=1777 \
            --workdir /workspace \
            lzocateli/angular-cli:22.1.0-node24.15.0-bookworm \
            bash -lc 'npm ci --no-audit --no-fund && npm test -- --watch=false && npm run build -- --configuration production'

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ci
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test non-integration .NET projects in container
        shell: bash
        run: |
          set -Eeuo pipefail
          projects=(
            backend/tests/Nodra.Notes.Api.UnitTests/Nodra.Notes.Api.UnitTests.csproj
            backend/tests/Nodra.Backend.Application.UnitTests/Nodra.Backend.Application.UnitTests.csproj
            backend/tests/Nodra.Backend.Domain.UnitTests/Nodra.Backend.Domain.UnitTests.csproj
            backend/tests/Nodra.Bff.UnitTests/Nodra.Bff.UnitTests.csproj
            backend/tests/Nodra.Notes.Worker.UnitTests/Nodra.Notes.Worker.UnitTests.csproj
          )
          for project in "${projects[@]}"; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env HOME=/tmp \
              --env DOTNET_CLI_HOME=/tmp \
              --env NUGET_PACKAGES=/tmp/nuget-packages \
              lzocateli/dotnet-sdk:10.0.403-noble-v1 \
              dotnet test "$project" --configuration Release --verbosity minimal
          done

      - name: Validate CI/CD contracts in container
        shell: bash
        run: |
          docker run --rm --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --entrypoint pwsh lzocateli/dotnet-sdk:10.0.403-noble-v1 \
            -NoProfile -File tools/scripts/test-cicd-contracts.ps1

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ci
    permissions:
      contents: read
    services:
      postgres:
        image: lzocateli/postgresql:18.4-pgvector0.8.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: altivy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altivy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap isolated PostgreSQL test roles
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/backend/libs/infrastructure/data/sql/001-bootstrap-altivy-roles.sql:/bootstrap.sql:ro" \
            --env PGPASSWORD=ci-local-only \
            --entrypoint psql \
            lzocateli/postgresql:18.4-pgvector0.8.6-bookworm \
            --host 127.0.0.1 --username postgres --dbname altivy \
            --set ON_ERROR_STOP=1 \
            --set altivy_migrator_password=ci-migrator-only \
            --set altivy_runtime_password=ci-runtime-only \
            --file /bootstrap.sql

      - name: Run PostgreSQL and filesystem integration tests in container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env DOTNET_CLI_HOME=/tmp \
            --env NUGET_PACKAGES=/tmp/nuget-packages \
            --env 'ALTIVY_INTEGRATION_MIGRATOR_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=altivy;Username=altivy_migrator;Password=ci-migrator-only;Timezone=UTC' \
            --env 'ALTIVY_INTEGRATION_RUNTIME_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=altivy;Username=altivy_runtime;Password=ci-runtime-only;Timezone=UTC' \
            lzocateli/dotnet-sdk:10.0.403-noble-v1 \
            dotnet test backend/tests/Nodra.Backend.Infra.Data.Postgres.IntegrationTests/Nodra.Backend.Infra.Data.Postgres.IntegrationTests.csproj \
              --configuration Release --verbosity minimal

  images:
    name: Container Images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true,"lazy-pull":false}}

      - name: Build production images in BuildKit
        shell: pwsh
        run: |
          ./tools/scripts/validate-release-images.ps1 -Image all -Tag ci

      - name: Verify BuildKit attestations
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DOCKER_HOST" == unix://* ]]
          for image in api bff worker web migrations; do
            echo "Verificando atestações de nodra-$image:ci"
            curl --fail --silent --show-error --unix-socket "${DOCKER_HOST#unix://}" \
              "http://localhost/v1.55/images/nodra-$image:ci/attestations?statement=1" |
              docker run --rm --interactive --network none --read-only \
                --tmpfs /tmp:rw,noexec,nosuid,mode=1777,size=32m --env HOME=/tmp \
                --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
                --entrypoint pwsh docker.io/lzocateli/dotnet-sdk:10.0.403-noble-v1@sha256:61320a81b460fdeb2d838f91e1204ded8b846335dbc572719bdd82cb109bec11 \
                -NoLogo -NoProfile -File tools/scripts/assert-buildkit-attestations.ps1
          done

      - name: Upload image security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security
          path: artifacts/security-local/*.json
          if-no-files-found: error
          retention-days: 14

  result:
    name: Result
    if: ${{ always() }}
    needs:
      - hygiene
      - gitleaks
      - repository-baseline
      - frontend
      - backend
      - backend-integration
      - images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate required jobs
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          REPOSITORY_BASELINE_RESULT: ${{ needs.repository-baseline.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_BASELINE_RESULT" != "success" ]]; then
            echo "Repository Baseline terminou com: $REPOSITORY_BASELINE_RESULT"
            exit 1
          fi
          for result in "$HYGIENE_RESULT" "$GITLEAKS_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$BACKEND_INTEGRATION_RESULT" "$IMAGES_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Gate de CI terminou com: $result"
              exit 1
            fi
          done