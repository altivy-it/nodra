name: Deploy application

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy selected components or restore the previous release
        required: true
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: Published SemVer tag, required for deploy (for example v1.2.3)
        required: false
        type: string
      components:
        description: Deploy frontend, backend, or both
        required: true
        type: choice
        options:
          - frontend
          - backend
          - all

permissions:
  contents: read

concurrency:
  group: altivynotes-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://notes.altivy.it
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
      COMPONENTS: ${{ inputs.components }}
      RELEASE_TAG: ${{ inputs.version }}
      GHCR_USERNAME: ${{ github.actor }}
    steps:
      - name: Checkout release source or deployment operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false

      - name: Validate inputs and configure pinned SSH host
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$OPERATION" == deploy ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
              echo 'Informe uma tag SemVer válida, como v1.2.3.' >&2
              exit 2
            }
          elif [[ "$OPERATION" == rollback ]]; then
            [[ -z "$RELEASE_TAG" ]] || { echo 'Não informe version durante rollback.' >&2; exit 2; }
          else
            echo 'Operação inválida.' >&2
            exit 2
          fi
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'VPS_HOST inválido.' >&2; exit 2; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo 'VPS_USER inválido.' >&2; exit 2; }
          if [[ ! "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || (( VPS_PORT == 0 || VPS_PORT >= 65536 )); then
            echo 'VPS_PORT inválido.' >&2
            exit 2
          fi
          [[ -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || {
            echo 'Configure VPS_SSH_PRIVATE_KEY e VPS_KNOWN_HOSTS no Environment production.' >&2
            exit 2
          }
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo 'Ator GHCR inválido.' >&2; exit 2; }

          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/ssh/id_key" >/dev/null
          cat > "$RUNNER_TEMP/ssh/config" <<EOF
          Host altivynotes-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile $RUNNER_TEMP/ssh/id_key
            UserKnownHostsFile $RUNNER_TEMP/ssh/known_hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ForwardAgent no
            RequestTTY no
          EOF
          chmod 0600 "$RUNNER_TEMP/ssh/config"
          ssh -F "$RUNNER_TEMP/ssh/config" altivynotes-vps true

      - name: Download and verify immutable release manifest
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern images.env \
            --pattern images.env.sha256 \
            --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum --check images.env.sha256)
          git show "$RELEASE_TAG:deploy/production/compose.yaml" > "$RUNNER_TEMP/release/compose.yaml"
          cp deploy/production/altivynotes-ops.sh "$RUNNER_TEMP/release/altivynotes-ops.sh"

      - name: Prepare remote release directory
        if: inputs.operation == 'deploy'
        env:
          REMOTE_RELEASE_DIR: /userapps/altivynotes/releases/${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -F "$RUNNER_TEMP/ssh/config" altivynotes-vps \
            "install -d -m 0750 '$REMOTE_RELEASE_DIR' /userapps/altivynotes/scripts"
          scp -F "$RUNNER_TEMP/ssh/config" \
            "$RUNNER_TEMP/release/images.env" \
            "$RUNNER_TEMP/release/compose.yaml" \
            "$RUNNER_TEMP/release/altivynotes-ops.sh" \
            "altivynotes-vps:$REMOTE_RELEASE_DIR/"
          scp -F "$RUNNER_TEMP/ssh/config" \
            "$RUNNER_TEMP/release/altivynotes-ops.sh" \
            altivynotes-vps:/userapps/altivynotes/scripts/altivynotes-ops.sh

      - name: Deploy selected components
        if: inputs.operation == 'deploy'
        env:
          REMOTE_RELEASE_DIR: /userapps/altivynotes/releases/${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | ssh -F "$RUNNER_TEMP/ssh/config" altivynotes-vps \
            "bash /userapps/altivynotes/scripts/altivynotes-ops.sh deploy-app '$COMPONENTS' '$RELEASE_TAG' '$REMOTE_RELEASE_DIR' '$GHCR_USERNAME'"

      - name: Roll back to previous application release
        if: inputs.operation == 'rollback'
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -F "$RUNNER_TEMP/ssh/config" \
            deploy/production/altivynotes-ops.sh \
            altivynotes-vps:/userapps/altivynotes/scripts/altivynotes-ops.sh
          printf '%s' "$GH_TOKEN" | ssh -F "$RUNNER_TEMP/ssh/config" altivynotes-vps \
            "bash /userapps/altivynotes/scripts/altivynotes-ops.sh rollback-app '$GHCR_USERNAME'"