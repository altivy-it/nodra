name: Propor feature
description: Registre uma necessidade de produto ou melhoria técnica
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema e contexto
      description: Quem enfrenta o problema e em qual situação?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado observável esperado
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite sugeridos
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade percebida
      options:
        - P0 - bloqueador
        - P1 - alta
        - P2 - normal
        - P3 - baixa
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Áreas envolvidas
      multiple: true
      options:
        - Arquitetura
        - Backend
        - Frontend
        - Banco de dados
        - Segurança
        - DevOps
        - Documentação
        - Testes
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Fora do escopo
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Use exemplos sintéticos, feedback ou métricas sem dados sensíveis.
