name: Executar slice do plano
description: Registre um slice aprovado e desbloqueado para execução
title: "[Plano]: "
labels: ["type:plan-slice", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Esta Issue autoriza a implementação e validação do slice descrito.
        Commit, push, merge, publicação e deploy continuam dependentes de
        solicitação e aprovação explícitas.

        Secrets locais existem somente em
        `$env:APPDATA\Microsoft\UserSecrets\Altivy.Notes\.env`. O agente não
        pode ler, listar, copiar, editar, sobrescrever nem exibir esse arquivo.
        Ele usa apenas variáveis já injetadas por processo autorizado e falha
        fechado se alguma variável obrigatória estiver ausente.
  - type: input
    id: plan
    attributes:
      label: Plano e slice
      description: Informe o plano e o identificador da etapa, por exemplo P-03 ou WP-02.
      placeholder: docs/plan/nome-do-plano.md / P-XX
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade
      options:
        - P0 - bloqueador
        - P1 - alta
        - P2 - normal
        - P3 - baixa
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área responsável
      multiple: true
      options:
        - Arquitetura
        - Backend
        - Frontend
        - Banco de dados
        - Segurança
        - DevOps
        - Documentação
        - Testes
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risco da mudança
      options:
        - baixo
        - médio
        - alto
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Release ou marco alvo
      placeholder: MVP, Fase 3, Fase 5 ou não definido
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências e bloqueios
      description: Liste IDs de Issues, etapas P-NN/WP-NN, ADRs ou decisões humanas necessárias.
      placeholder: "Nenhuma ou #123, P-02 e ADR 2026-0001"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado observável
      description: Descreva o comportamento que demonstra a conclusão do slice.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite e validação
      description: Liste cenários, plataformas e gates que devem passar.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Limites e não escopo
      description: Registre o que não deve ser alterado ou entregue nesta Issue.
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Autorizações e decisões humanas
      options:
        - label: O slice está aprovado e suas dependências estão atendidas.
          required: true
        - label: O Copilot pode editar arquivos e executar as validações deste slice.
          required: true
        - label: Commit, push, merge, publicação e deploy exigem autorização separada.
          required: true
        - label: Avaliei se o slice exige ADR ou outra decisão humana prévia.
          required: true
