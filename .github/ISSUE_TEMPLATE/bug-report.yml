name: Reportar bug
description: Relate comportamento incorreto, regressão ou falha operacional
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Não inclua notas reais, tokens, senhas, connection strings ou dados pessoais.
        Vulnerabilidades devem seguir o fluxo descrito em SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade percebida
      options:
        - P0 - bloqueador
        - P1 - alta
        - P2 - normal
        - P3 - baixa
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      multiple: true
      options:
        - Backend
        - Frontend
        - Banco de dados
        - Segurança
        - DevOps
        - Documentação
        - Testes
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      placeholder: Versão/tag, navegador, sistema operacional, Docker e armazenamento do vault.
  - type: textarea
    id: evidence
    attributes:
      label: Logs e evidências sanitizadas
      description: Remova conteúdo de notas, secrets, tokens e paths sensíveis.
