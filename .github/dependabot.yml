version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    # Workflows gw-*.yml são gerenciados pelo Altivy.Groundwork; atualize-os com groundwork update.
    exclude-paths:
      - ".github/workflows/gw-*.yml"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"