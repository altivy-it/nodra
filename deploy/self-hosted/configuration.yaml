services:
  source:
    image: lzocateli/dotnet-sdk:10.0.400-noble
    environment:
      POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USERNAME:-}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      RUNTIME: ${ALTIVY_POSTGRES_RUNTIME_CONNECTION_STRING:-${ALTIVY_INTEGRATION_RUNTIME_CONNECTION_STRING:-}}
      MIGRATOR: ${ALTIVY_POSTGRES_MIGRATOR_CONNECTION_STRING:-${ALTIVY_INTEGRATION_MIGRATOR_CONNECTION_STRING:-}}
      BFF_SECRET: ${ALTIVY_BFF_CLIENT_SECRET:-${ALTIVY_E2E_BFF_CLIENT_SECRET:-}}
      PFX_PASSWORD: ${ALTIVY_DATA_PROTECTION_CERTIFICATE_PASSWORD:-}
      PROVISIONER_SECRET: ${ALTIVY_PROVISIONER_CLIENT_SECRET:-}
      AUTHORITY: ${ALTIVY_KEYCLOAK_AUTHORITY:-${KEYCLOAK_PUBLIC_URL:-https://localhost:7443}/realms/altivy}
      ORIGIN: ${ALTIVY_PUBLIC_ORIGIN:-https://localhost:8443}
      DATA_ROOT: ${ALTIVY_DATA_ROOT:-}
      CONFIG_ROOT: ${ALTIVY_CONFIG_ROOT:-}
      PROXY_SUBNET: ${ALTIVY_PROXY_BFF_SUBNET:-172.29.0.0/24}
      GATEWAY_IP: ${ALTIVY_GATEWAY_IP:-172.29.0.10}
      SMTP_HOST: ${ALTIVY_SMTP_HOST:-}
      SMTP_PORT: ${ALTIVY_SMTP_PORT:-587}
      SMTP_USERNAME: ${ALTIVY_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${ALTIVY_SMTP_PASSWORD:-}
      SMTP_FROM: ${ALTIVY_SMTP_FROM:-}
      SMTP_TO: ${ALTIVY_SMTP_TO:-}