server {
    listen 443 ssl;
    server_name notes.altivy.it;

    ssl_certificate /userapps/ssl/altivy.it.pem;
    ssl_certificate_key /userapps/ssl/altivy.it.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ~ ^/(bff|api/v1|hubs|signin-oidc|signout-callback-oidc)(/|$) {
        set $altivynotes_bff http://altivynotes-bff:8080;
        proxy_pass $altivynotes_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        set $altivynotes_web http://altivynotes-web:8080;
        proxy_pass $altivynotes_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}