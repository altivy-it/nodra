server {
    listen 7443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location ~ ^/(realms|resources|admin)(/|$) {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:7443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host localhost:7443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 7443;
    }

    location ~ ^/(bff|api/v1|hubs|signin-oidc|signout-callback-oidc)(/|$) {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:7443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host localhost:7443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 7443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        set $web_upstream web:8080;
        proxy_pass http://$web_upstream;
        proxy_set_header Host localhost:7443;
        proxy_set_header X-Forwarded-Proto https;
    }
}