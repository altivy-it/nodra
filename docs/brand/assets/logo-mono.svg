<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Monocromático do Basalt Notes">
    <title>Logo Monocromático do Basalt Notes</title>
    <desc>Versão monocromática do logo horizontal com o ícone de rocha contornada e 2 órbitas em X.</desc>
    <style>
        .shape {
            fill: currentColor;
            stroke: none;
        }
        .rock-outline {
            fill: none;
            stroke: currentColor;
            stroke-width: 12;
            stroke-linejoin: round;
        }
        .orbit-outline {
            fill: none;
            stroke: currentColor;
            stroke-width: 8;
        }
        .text-logo {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 100px;
            font-weight: 700;
            fill: currentColor;
        }
        .text-logo .light {
            font-weight: 400;
        }
    </style>
    <!-- Ícone -->
    <g transform="translate(24, 24) scale(0.95)">
        <g transform="translate(128 128)" class="orbit-outline">
            <ellipse cx="0" cy="0" rx="90" ry="35" transform="rotate(45)"/>
            <ellipse cx="0" cy="0" rx="90" ry="35" transform="rotate(-45)"/>
        </g>
        <g transform="translate(64, 64) scale(0.5)">
            <path class="rock-outline" d="M45,195 C40,120 80,50 95,45 L180,40 L225,110 C215,180 150,225 135,220 L45,195Z" />
        </g>
        <g class="shape">
            <circle cx="198" cy="83" r="7"/>
            <circle cx="58" cy="83" r="7"/>
        </g>
    </g>
    <!-- Texto -->
    <text x="320" y="185" class="text-logo">
        Basalt <tspan class="light">Notes</tspan>
    </text>
</svg>