<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Horizontal do Basalt Notes (Tema Escuro)">
    <title>Logo Horizontal do Basalt Notes (Tema Escuro)</title>
    <desc>Logo horizontal para tema escuro com o ícone de rocha contornada e 2 órbitas em X à esquerda e o texto "Basalt Notes" à direita.</desc>
    <style>
        .icon-rock-base { fill: #4A5568; stroke: #A0AEC0; stroke-width: 4; }
        .icon-rock-shadow { fill: #2D3748; stroke: #A0AEC0; stroke-width: 4; }
        .icon-rock-highlight { fill: #718096; stroke: #A0AEC0; stroke-width: 4; }
        .icon-orbit-path { stroke: #5A5A8C; stroke-width: 4; fill: none; }
        .icon-orbit-node { fill: #5A5A8C; }
        .text-logo {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 100px;
            font-weight: 700;
            fill: #E2E8F0;
        }
        .text-logo .light {
            font-weight: 400;
            fill: #A0AEC0;
        }
    </style>
    <!-- Ícone -->
    <g transform="translate(24, 24) scale(0.95)" stroke-linejoin="round">
        <g transform="translate(128 128)">
            <ellipse class="icon-orbit-path" cx="0" cy="0" rx="90" ry="35" transform="rotate(45)"/>
            <ellipse class="icon-orbit-path" cx="0" cy="0" rx="90" ry="35" transform="rotate(-45)"/>
        </g>
        <g transform="translate(64, 64) scale(0.5)">
            <path class="icon-rock-base" d="M45,195 C40,120 80,50 95,45 L180,40 L225,110 C215,180 150,225 135,220 L45,195Z" />
            <path class="icon-rock-shadow" d="M95,45 L80,120 L140,150 L180,40 L95,45Z" />
            <path class="icon-rock-highlight" d="M140,150 L225,110 L210,180 L135,220 L140,150Z" />
        </g>
        <g class="icon-orbit-node">
            <circle cx="198" cy="83" r="7"/>
            <circle cx="58" cy="83" r="7"/>
        </g>
    </g>
    <!-- Texto -->
    <text x="320" y="185" class="text-logo">
        Basalt <tspan class="light">Notes</tspan>
    </text>
</svg>