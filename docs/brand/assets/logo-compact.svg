<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Compacto do Basalt Notes">
    <title>Logo Compacto do Basalt Notes</title>
    <desc>Logo compacto com o ícone de rocha contornada e 2 órbitas em X, acima do texto "Basalt Notes".</desc>
    <style>
        .icon-rock-base { fill: #A3BFFA; stroke: #4A5568; stroke-width: 4; }
        .icon-rock-shadow { fill: #7F9CF5; stroke: #4A5568; stroke-width: 4; }
        .icon-rock-highlight { fill: #C3DAFE; stroke: #4A5568; stroke-width: 4; }
        .icon-orbit-path { stroke: #DCD7FE; stroke-width: 4; fill: none; }
        .icon-orbit-node { fill: #DCD7FE; }
        .text-logo {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 48px;
            font-weight: 700;
            fill: #2D3748;
            text-anchor: middle;
        }
        .text-logo .light {
            font-weight: 400;
            fill: #4A5568;
        }
    </style>
    <!-- Ícone -->
    <g transform="translate(22, 0) scale(0.9)">
        <!-- Órbitas em X -->
        <g transform="translate(128 128)">
            <ellipse class="icon-orbit-path" cx="0" cy="0" rx="90" ry="35" transform="rotate(45)"/>
            <ellipse class="icon-orbit-path" cx="0" cy="0" rx="90" ry="35" transform="rotate(-45)"/>
        </g>
        <!-- Rocha -->
        <g transform="translate(64, 64) scale(0.5)" stroke-linejoin="round">
            <path class="icon-rock-base" d="M45,195 C40,120 80,50 95,45 L180,40 L225,110 C215,180 150,225 135,220 L45,195Z" />
            <path class="icon-rock-shadow" d="M95,45 L80,120 L140,150 L180,40 L95,45Z" />
            <path class="icon-rock-highlight" d="M140,150 L225,110 L210,180 L135,220 L140,150Z" />
        </g>
        <!-- Nodos -->
        <g class="icon-orbit-node">
            <circle cx="198" cy="83" r="7"/>
            <circle cx="58" cy="83" r="7"/>
        </g>
    </g>
    <!-- Texto -->
    <text x="150" y="270" class="text-logo">
        Basalt <tspan class="light">Notes</tspan>
    </text>
</svg>