<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept C — Letter B constructed from knowledge graph nodes">
  <title>Concept C — B Monogram as Knowledge Graph</title>
  <desc>The letter B is constructed entirely from nodes (circles) and edges (lines), referencing both the product initial and the backlink/graph structure of Basalt Notes. The central spine runs vertically on the left; two bumps are built from connected nodes on the right.</desc>

  <!-- ─── Graph edges forming the letter B ─── -->

  <!-- Left spine: node 1 → 2 → 3 -->
  <line x1="22" y1="15" x2="22" y2="50" stroke="#3D3D3D" stroke-width="2"   stroke-linecap="round"/>
  <line x1="22" y1="50" x2="22" y2="85" stroke="#3D3D3D" stroke-width="2"   stroke-linecap="round"/>

  <!-- Top bump outline: 1→4→5→6→7→2 -->
  <line x1="22" y1="15" x2="46" y2="15" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46" y1="15" x2="64" y2="27" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="64" y1="27" x2="64" y2="43" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="64" y1="43" x2="46" y2="50" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46" y1="50" x2="22" y2="50" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bottom bump outline: 2→7→8→9→10→3 -->
  <line x1="22" y1="50" x2="46" y2="50" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46" y1="50" x2="67" y2="60" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="67" y1="60" x2="67" y2="75" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="67" y1="75" x2="46" y2="85" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46" y1="85" x2="22" y2="85" stroke="#3D3D3D" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cross / diagonal connections (graph feel) -->
  <line x1="46" y1="15" x2="64" y2="43" stroke="#707070" stroke-width="1"   stroke-linecap="round"/>
  <line x1="46" y1="50" x2="67" y2="75" stroke="#707070" stroke-width="1"   stroke-linecap="round"/>
  <line x1="22" y1="15" x2="46" y2="50" stroke="#707070" stroke-width="0.8" stroke-linecap="round"/>

  <!-- ─── Nodes ─── -->

  <!-- Spine nodes (teal — hub nodes) -->
  <circle cx="22" cy="15" r="5.5" fill="#0F766E"/>
  <circle cx="22" cy="50" r="5.5" fill="#0F766E"/>
  <circle cx="22" cy="85" r="5.5" fill="#0F766E"/>

  <!-- Top bump nodes -->
  <circle cx="46" cy="15" r="4.5" fill="#1E1E1E"/>
  <circle cx="64" cy="27" r="4"   fill="#1E1E1E"/>
  <circle cx="64" cy="43" r="4"   fill="#1E1E1E"/>

  <!-- Middle junction node -->
  <circle cx="46" cy="50" r="4.5" fill="#3D3D3D"/>

  <!-- Bottom bump nodes -->
  <circle cx="67" cy="60" r="4"   fill="#1E1E1E"/>
  <circle cx="67" cy="75" r="4"   fill="#1E1E1E"/>
  <circle cx="46" cy="85" r="4.5" fill="#1E1E1E"/>
</svg>
