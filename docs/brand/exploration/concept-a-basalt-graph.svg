<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept A — Basalt hexagon with knowledge graph">
  <title>Concept A — Basalt + Knowledge Graph</title>
  <desc>Flat-top hexagon representing a basalt column cross-section. Inside, five nodes connected by edges form a knowledge graph, with a teal central hub node.</desc>

  <!-- Outer hexagon (flat-top, basalt column reference) -->
  <polygon
    points="91,50 70.5,85.5 29.5,85.5 9,50 29.5,14.5 70.5,14.5"
    fill="none"
    stroke="#0F766E"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Knowledge graph edges — hub spokes -->
  <line x1="50" y1="50" x2="50" y2="26" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68" y2="37" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68" y2="65" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="32" y2="65" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Knowledge graph edges — peripheral connections -->
  <line x1="50" y1="26" x2="68" y2="37" stroke="#707070" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="65" x2="32" y2="65" stroke="#707070" stroke-width="1" stroke-linecap="round"/>

  <!-- Peripheral nodes -->
  <circle cx="50" cy="26" r="4.5" fill="#1E1E1E"/>
  <circle cx="68" cy="37" r="4"   fill="#1E1E1E"/>
  <circle cx="68" cy="65" r="4"   fill="#1E1E1E"/>
  <circle cx="32" cy="65" r="4"   fill="#1E1E1E"/>

  <!-- Central hub node (teal — primary accent) -->
  <circle cx="50" cy="50" r="6.5" fill="#0F766E"/>
</svg>
